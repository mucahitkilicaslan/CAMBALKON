
name: Expo Projesini Kaydet

on:
  workflow_dispatch:

jobs:
  expo-kayit:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub dosyalarini al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Expo ve EAS CLI kur
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Proje bagimliliklarini kur
        run: npm install

      - name: Expo projesini olustur veya bagla
        run: eas init --force --non-interactive

      - name: Project ID bilgisini goster
        run: |
          node -e "const c=require('./app.json'); console.log('Project ID:', c.expo?.extra?.eas?.projectId || 'Bulunamadi')"
